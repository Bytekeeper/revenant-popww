name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 g++-mingw-w64-i686 cmake ninja-build
          rustup toolchain install stable --profile minimal --target i686-pc-windows-gnu
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test -p popww --target x86_64-unknown-linux-gnu

      - name: Build
        run: cargo build --release

      # Built here with the C++ runtime linked in; DSOAL's own builds need Microsoft's VC++ runtime.
      - name: Build DSOAL
        run: |
          git clone --quiet https://github.com/kcat/dsoal.git dsoal
          git -C dsoal checkout --quiet ${DSOAL_COMMIT}
          cmake -S dsoal -B dsoal-build -G Ninja -DCMAKE_TOOLCHAIN_FILE=$PWD/ci/mingw32.cmake -DCMAKE_BUILD_TYPE=Release -DDSOAL_UPDATE_BUILD_VERSION=OFF
          ninja -C dsoal-build
          i686-w64-mingw32-strip dsoal-build/dsound.dll
        env:
          DSOAL_COMMIT: dc9320074a2df98ad698d4309ff58697f40ead3e

      - name: Fetch OpenAL Soft
        run: |
          curl -sSLo openal.zip https://github.com/kcat/openal-soft/releases/download/${OPENAL_VERSION}/openal-soft-${OPENAL_VERSION}-bin.zip
          echo "${OPENAL_SHA256}  openal.zip" | sha256sum -c
          unzip -q openal.zip -d openal
        env:
          OPENAL_VERSION: 1.25.2
          OPENAL_SHA256: 67a0c4b800bd860c93c04f38caf8cbe4875f9c84700ac430efc451f70e265434

      - name: Package
        run: |
          mkdir -p dist/popww-licenses
          cp target/i686-pc-windows-gnu/release/PrinceOfPersia.exe target/i686-pc-windows-gnu/release/popww.dll README.md LICENSE dist/
          cp dsoal-build/dsound.dll dist/popww-dsoal.dll
          cp openal/openal-soft-*-bin/bin/Win32/soft_oal.dll dist/dsoal-aldrv.dll
          cp dsoal/LICENSE dist/popww-licenses/DSOAL-LICENSE.txt
          cp dsoal/fmt-*/LICENSE dist/popww-licenses/DSOAL-fmt-LICENSE.txt
          cp openal/openal-soft-*-bin/COPYING dist/popww-licenses/OpenALSoft-COPYING.txt
          cp openal/openal-soft-*-bin/LICENSE-pffft dist/popww-licenses/OpenALSoft-LICENSE-pffft.txt
          cd dist && zip -9 -r ../revenant-popww-${GITHUB_REF_NAME//\//-}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: revenant-popww
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: revenant-popww-*.zip
          generate_release_notes: true
